<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Продукт Плюс</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: system-ui; }
.product-img { width:80px;height:80px;object-fit:cover;border-radius:8px; }
</style>

</head>

<body class="bg-gray-50">

<header class="bg-blue-700 text-white sticky top-0 z-50 p-4 flex justify-between">
<h1 class="text-xl font-bold">Продукт Плюс</h1>
<div>🛒 <span id="cart-count">0</span></div>
</header>

<div class="p-4 sticky top-[60px] bg-white z-40">
<input id="search" placeholder="Пошук..." class="w-full p-3 border rounded-xl">
</div>

<div id="products" class="p-4 space-y-3"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/15vBAsDOUfPz_WVTK1brfWIDAUDFoN88lJPMyDbUZaE8/export?format=csv";

let products = [];
let cart = JSON.parse(localStorage.getItem("cart") || "[]");

const photoExt = ['webp','png'];

// ---------------- LOAD ----------------
async function loadData() {
  const cache = localStorage.getItem("products");

  if (cache) {
    products = JSON.parse(cache);
    render(products);
    return;
  }

  const res = await fetch(CSV_URL);
  const text = await res.text();
  products = parseCSV(text);

  localStorage.setItem("products", JSON.stringify(products));
  render(products);
}

// ---------------- CSV ----------------
function parseCSV(text) {
  const lines = text.split('\n');
  const result = [];

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');

    if (!cols[2]) continue;

    const price = parseFloat(cols[4]) || 0;
    if (price <= 0) continue;

    result.push({
      id: cols[1] || i,
      code: cols[1],
      name: cols[2],
      price
    });
  }

  return result;
}

// ---------------- IMAGE ----------------
function getImg(code, i=0) {
  return `https://raw.githubusercontent.com/zaharovandnikol-vfif/product-plus/main/photos/${code}.${photoExt[i]}`;
}

// ---------------- RENDER ----------------
function render(list) {
  const container = document.getElementById("products");
  container.innerHTML = "";

  const frag = document.createDocumentFragment();

  list.slice(0,200).forEach(p => {
    const div = document.createElement("div");
    div.className = "bg-white p-4 rounded-xl flex gap-3 items-center";

    const img = document.createElement("img");
    img.className = "product-img";
    img.loading = "lazy";
    img.src = getImg(p.code);

    img.onerror = () => {
      if (img.src.includes("webp")) img.src = getImg(p.code,1);
      else img.style.display="none";
    };

    div.innerHTML = `
      <div class="flex-1">
        <div class="text-sm text-gray-500">${p.code}</div>
        <div>${p.name}</div>
      </div>
      <div class="text-blue-700 font-bold">${p.price} грн</div>
      <button class="bg-blue-600 text-white px-3 py-2 rounded">+</button>
    `;

    div.querySelector("button").onclick = () => addToCart(p);

    div.prepend(img);
    frag.appendChild(div);
  });

  container.appendChild(frag);
}

// ---------------- SEARCH (debounce) ----------------
let timer;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const val = e.target.value.toLowerCase();

    const filtered = products.filter(p =>
      p.name.toLowerCase().includes(val) ||
      p.code.toLowerCase().includes(val)
    );

    render(filtered);
  }, 300);
});

// ---------------- CART ----------------
function addToCart(p) {
  const found = cart.find(i => i.id === p.id);
  if (found) found.qty++;
  else cart.push({...p, qty:1});

  saveCart();
}

function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
}

function updateCart() {
  const count = cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById("cart-count").textContent = count;
}

// ---------------- INIT ----------------
updateCart();
loadData();

</script>

</body>
</html>
